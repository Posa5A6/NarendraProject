<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Menu Studio · Hotel Rajshri</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="site-header"></div><main class="owner-shell"><div class="container"><div id="owner-login" class="panel owner-login"><img src="assets/logo-cropped.png" class="owner-login-logo" alt="Rajshri"><div class="eyebrow" style="justify-content:center">Private owner area</div><h1 class="serif">Restaurant menu studio.</h1><p class="muted">Maintain the regular and Jain menu from this browser. No customer ordering or payment functions are included in this version.</p><div class="field" style="text-align:left"><label>Owner PIN</label><input id="owner-pin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"></div><button class="btn btn-primary" id="owner-enter" style="width:100%;margin-top:16px">Enter studio →</button><p class="auth-note">Prototype PIN: <strong>2580</strong>. Replace with real owner authentication before launch.</p></div><div id="owner-app" hidden><div class="owner-grid"><aside class="owner-sidebar"><img class="owner-logo" src="assets/logo-cropped.png" alt="Rajshri"><div class="owner-nav"><button class="active" data-view="menu">Menu Studio</button><button data-view="jain">Jain Menu</button></div><button class="btn btn-gold" style="width:100%;margin-top:16px" id="owner-reset">Sign out</button></aside><section class="owner-main"><div id="owner-menu" class="owner-view"></div><div id="owner-jain" class="owner-view" hidden></div></section></div></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>
const pin=document.getElementById('owner-pin'),login=document.getElementById('owner-login'),app=document.getElementById('owner-app');
document.getElementById('owner-enter').onclick=()=>{if(pin.value!=='2580')return alert('Use prototype owner PIN 2580');sessionStorage.setItem('rajshri-owner','1');show()};document.getElementById('owner-reset').onclick=()=>{sessionStorage.removeItem('rajshri-owner');location.reload()};
const views={menu:document.getElementById('owner-menu'),jain:document.getElementById('owner-jain')};
function show(){login.hidden=true;app.hidden=false;renderMenuStudio();renderJain()}
let menuSearch='';
function filteredItems(){const q=menuSearch.trim().toLowerCase();return q?getMenu().filter(x=>x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)):getMenu()}
function renderMenuStudio(){const all=getMenu();const items=filteredItems().map(x=>({x,i:all.indexOf(x)}));views.menu.innerHTML=`<div class="owner-top"><div><div class="eyebrow">Menu Studio</div><h1 class="serif">Supply the menu.</h1><p class="muted">Add, edit or remove dishes without touching the customer pages. The public menu reads this browser's saved menu data.</p></div><div class="owner-actions"><button class="btn btn-light" onclick="exportMenu()">Export JSON</button><button class="btn btn-primary" onclick="addDish()">+ Add dish</button></div></div><div class="owner-panel"><div class="menu-studio-toolbar"><input id="owner-menu-search" placeholder="Search dish, category…" value="${esc(menuSearch)}" oninput="menuSearch=this.value;renderMenuStudio()"><button class="danger" onclick="resetMenu();localStorage.removeItem('rajshri-menu-v2');renderMenuStudio()">Reset supplied menu</button></div><div class="menu-editor-head"><span>Dish</span><span>Price</span><span>Category</span><span>Image URL</span><span></span></div><div class="menu-editor">${items.map(({x,i})=>{const img=imageFor(x);return `<div class="editor-row"><div class="editor-dish"><img loading="lazy" decoding="async" src="${esc(img.src)}" alt=""><input value="${esc(x.name)}" onchange="editDish(${i},'name',this.value)"></div><input type="number" step="0.5" value="${x.price}" onchange="editDish(${i},'price',this.value)"><select onchange="editDish(${i},'category',this.value)">${['Breakfast','Soups','Starters','Meals','Roti','Dal','North Indian Curries','Curd & Raita','Rice','Fried Rice','Noodles','Desserts'].map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select><input value="${esc(x.imageUrl||'')}" placeholder="https://… image URL" onchange="editDish(${i},'imageUrl',this.value)"><button class="danger" onclick="deleteDish(${i})" aria-label="Delete">×</button></div>`}).join('')}</div><p class="studio-note"><strong>Images:</strong> paste a direct image URL. For production, store optimized images on a CDN/object storage and keep only their URLs here.</p></div>`}
window.editDish=(i,k,v)=>{const m=getMenu();m[i][k]=k==='price'?Number(v):v;saveMenu(m);toast('Menu updated')};window.deleteDish=i=>{const m=getMenu();m.splice(i,1);saveMenu(m);renderMenuStudio()};window.addDish=()=>{const m=getMenu();m.push({category:'Starters',name:'New dish',price:0,image:'starter',imageUrl:'',imageSource:''});saveMenu(m);renderMenuStudio()};window.exportMenu=()=>{const blob=new Blob([JSON.stringify(getMenu(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rajshri-menu.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
function renderJain(){views.jain.innerHTML=`<div class="owner-top"><div><div class="eyebrow">Jain Menu</div><h1 class="serif">Keep it separate.</h1><p class="muted">The Jain menu remains an independent source so it can be supplied and verified without changing the regular menu.</p></div></div><div class="owner-panel"><h2 class="serif" style="font-size:2rem;color:var(--deep);margin:0 0 8px">Jain menu source pending</h2><p class="muted">No Jain dishes are guessed here. Add the verified Jain sheet when it is supplied.</p></div>`}
$$('.owner-nav button').forEach(b=>b.onclick=()=>{$$('.owner-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');Object.values(views).forEach(v=>v.hidden=true);views[b.dataset.view].hidden=false;if(b.dataset.view==='menu')renderMenuStudio()});
if(sessionStorage.getItem('rajshri-owner'))show();
</script></body></html>
